name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  ARTIFACTORY: swarm.azurecr.io
  IMAGE_NAME: onnx-2-hef

jobs:
  build_and_push:
    runs-on: [ self-hosted, Linux, X64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: tag image
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAG="${{ github.head_ref }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          TAG="${TAG//\//-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker info
        run: docker info

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACTORY }}
          username: ${{ secrets.AZURE_DOCKER_USERNAME }}
          password: ${{ secrets.AZURE_DOCKER_PASSWORD }}

      - name: Build image
        run: |
          docker build \
            --build-arg SSH_PRIVATE_KEY="${{ secrets.SSH_PRIVATE_KEY }}" \
            -t "${{ env.ARTIFACTORY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}" \
            .

      - name: Push image (main -> latest, else -> branch tag)
        shell: bash
        run: |
          IMG="${{ env.ARTIFACTORY }}/${{ env.IMAGE_NAME }}"
          TAG="${{ steps.vars.outputs.tag }}"

          if [[ "${{ github.ref_name }}" == "main" && "${{ github.event_name }}" == "push" ]]; then
            docker tag "$IMG:$TAG" "$IMG:latest"
            docker push "$IMG:latest"
          else
            docker push "$IMG:$TAG"
          fi
